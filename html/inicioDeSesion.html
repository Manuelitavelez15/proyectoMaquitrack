<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="/css/estilosInicioDeSesion.css">
</head>

<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form action="/login-endpoint" method="post">
            <div class="form-group">
                <label for="email">Usuario</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="tu contraseña" required minlength="10" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>

        <div class="form-footer">
            <p><a href="">¿Olvidaste tu contraseña?</a></p>
            <p><a href="./registrarse.html">Registrarse</a></p>
        </div>
    </div>

</body>

</html>
