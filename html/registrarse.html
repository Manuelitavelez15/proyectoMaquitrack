<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Maquitrack</title>
        <link rel="stylesheet" href="css/estilos.css">
        <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    </head>
    <body class="body-iniciodesesion">
           <div class="login-containeriniciodesesion">
                <h2>Crea Una Cuenta</h2>
                <form action="/register-endpoint" method="post">
                    <div class="form-groupiniciodesesion">
                        <label for="fullname">Nombre Completo</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Pepito Perez" required autocomplete="name">
                    </div>
                    <div class="form-groupiniciodesesion">
                        <label for="new-email">Correo Electrónico</label>
                        <input type="email" id="new-email" name="email" placeholder="Ejemplo@correo.com" required autocomplete="email">
                    </div>
                    <div class="form-groupiniciodesesion">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Crea Una Contraseña" required minlength="10" autocomplete="new-password">
                    </div>
                    <div class="form-groupiniciodesesion">
                        <label for="confim-password">Confirmar Contraseña</label>
                        <input type="password" id="confim password" name="confim password" placeholder="Confirma tu contraseña" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-submitiniciodesesion">Registrarse</button>
                </form>
                <div class="form-footeriniciodesesion">
                    <p style="color: #e6b325;">¿Ya Tienes una Cuenta?</p><a href="iniciodesesion.html">Iniciar Sesión</a>
                </div>
            </div>
    </body>
</html>
