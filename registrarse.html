<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./estilos.css">
    <title>Registrarse</title>
</head>

<body>
    <div class="login-container">
        <h2>Crea Una Cuenta</h2>
        <form action="/register-endpoint" method="post">
            <div class="form-group">
                <label for="fullname">Nombre Completo</label>
                <input type="text" id="fullname" name="fullname" placeholder="Pepito Perez" required
                    autocomplete="name">
            </div>
            <div class="form-group">
                <label for="new-email">Correo Electronico</label>
                <input type="email" id="new-email" name="email" placeholder="Ejemplo@correo.com" required
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Nueva Contraseña" required
                    autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confim-password">Confirmar Contraseña</label>
                <input type="password" id="confim password" name="confim password" placeholder="Confirma tu contraseña"
                    required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-submit">Registrarse</button>
        </form>
        <div class="form-footer">
            <p style="color: #e6b325;">¿Ya Tienes Cuenta?</p><a href="InicioDeSesion.html">Inicia Sesion</a>

        </div>


    </div>





</body>

</html>
